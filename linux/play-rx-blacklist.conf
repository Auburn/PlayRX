# Play RX: Linux's own Wi-Fi drivers for the RTL8812BU must not take the adapters (they are used as receivers).
# Other Wi-Fi cards (a laptop's built-in Wi-Fi, a Raspberry Pi's) use other drivers and are not affected.
# While this file is here, an RTL8812BU dongle does not work as a Wi-Fi card on this computer.
blacklist rtw88_8822bu
blacklist rtw_8822bu
blacklist 88x2bu
