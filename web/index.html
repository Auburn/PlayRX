<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Play RX</title>
<link rel="stylesheet" href="/ui/arx.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><span class="brand-mark" id="brand-mark">PL</span><span id="brand-name">Play League</span><span class="brand-ver" id="brand-ver"></span></div>
    <span id="sim-pill" class="pill pill-accent plain hidden">SIMULATED</span>
    <div class="spacer"></div>
    <button id="fullscreen" class="btn btn-ghost btn-icon" title="Full screen video (F11)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
    </button>
  </header>
  <nav class="sidebar" id="nav">
    <a class="nav-item" data-view="live" href="#/live">
      <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4" fill="currentColor" stroke="none"/></svg>Live</a>
    <div class="nav-sep"></div>
    <a class="nav-item" data-view="pilots" href="#/pilots">
      <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5M16 4.5a3.5 3.5 0 0 1 0 7M18.5 14.8c1.6.9 2.6 2.6 3 5.2"/></svg><span id="nav-pilots">Slots</span></a>
    <div class="nav-sep"></div>
    <a class="nav-item" data-view="obs" href="#/obs">
      <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="12" rx="2"/><path d="M8 21h8M12 17v4"/><circle cx="12" cy="11" r="2.5"/></svg>OBS</a>
    <div class="nav-sep"></div>
    <a class="nav-item" data-view="node" href="#/node">
      <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="8" height="6" rx="1"/><rect x="13" y="14" width="8" height="6" rx="1"/><path d="M7 10v4h10M17 14v-4h-3"/></svg>Feed node</a>
    <a class="nav-item" data-view="adapters" href="#/adapters">
      <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v7M8 6l4-3 4 3M7 10h10v5a5 5 0 0 1-10 0z"/></svg>Adapters &amp; scan</a>
    <a class="nav-item" data-view="settings" href="#/settings">
      <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>Settings</a>
    <a class="nav-item" data-view="log" href="#/log">
      <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 6h14M5 12h14M5 18h9"/></svg>Log</a>
    <div class="nav-sep"></div>
    <a class="nav-item" id="nav-discord" href="https://discord.gg/CyraVUs38j" target="_blank" rel="noopener" title="Join the Discord: help, news, ideas (opens in your browser)">
      <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.4A8 8 0 1 1 21 12z"/><path d="M8.5 11h.01M12 11h.01M15.5 11h.01"/></svg>Discord</a>
    <div class="sidebar-foot" id="foot"></div>
  </nav>
  <main class="main" id="view"></main>
</div>
<script type="module" src="/ui/app.js"></script>
</body>
</html>
